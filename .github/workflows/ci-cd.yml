name: CI/CD Pipeline - Test, Build & Publish

"on":
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

# Enforce least-privilege permissions at top level
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. Automated Testing & Configuration Validation (Continuous Integration)
  # ============================================================================
  test:
    name: Pytest Test Suite & Configuration Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed and verify offline W&B artifact cache
        run: |
          CACHE_DEST=".wandb_artifacts_cache/bhavanishreddy69-na_cyclone-preparedness-assistant_village-preparedness-classifier_v0"
          mkdir -p "$CACHE_DEST"
          cp -r models/render_artifact/. "$CACHE_DEST"/
          python -c "
          import hashlib
          from pathlib import Path
          src_dir = Path('models/render_artifact')
          dst_dir = Path('$CACHE_DEST')
          for src in src_dir.iterdir():
              if src.is_file():
                  dst = dst_dir / src.name
                  assert dst.exists(), f'Missing cached file: {src.name}'
                  assert hashlib.sha256(src.read_bytes()).digest() == hashlib.sha256(dst.read_bytes()).digest(), f'Checksum mismatch: {src.name}'
          print('W&B offline artifact cache seeded and verified successfully.')
          "

      - name: Verify Git LFS datasets
        run: |
          python -c "
          from pathlib import Path
          required_datasets = [
              'data/processed/coastal_vulnerability_archetypes.parquet',
              'data/processed/unified_village_preparedness.parquet',
              'data/processed/unified_village_preparedness_v2.parquet',
              'data/processed/village_preparedness_probabilities.parquet',
              'data/processed/modelling_dataset.parquet',
              'data/processed/master_village_preparedness.parquet',
          ]
          for rel_path in required_datasets:
              p = Path(rel_path)
              assert p.is_file(), f'CRITICAL: Required dataset missing: {rel_path}'
              with open(p, 'rb') as f:
                  magic = f.read(4)
                  assert magic == b'PAR1', (
                      f'CRITICAL: {rel_path} is not a valid binary Parquet file. '
                      f'Found header bytes: {magic}. Git LFS files may not have been checked out.'
                  )
          print('All required Git LFS Parquet datasets verified.')
          "

      - name: Run complete test suite (pytest)
        run: |
          pytest -ra -v

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet

  # ============================================================================
  # 2. Docker Image Build & GHCR Publishing
  # ============================================================================
  build-and-publish:
    name: Build & Publish (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image_name: cyclone-assistant-api
            dockerfile: Dockerfile.api
          - service: dashboard
            image_name: cyclone-assistant-dashboard
            dockerfile: Dockerfile.dashboard

    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Seed and verify offline W&B artifact cache
        run: |
          CACHE_DEST=".wandb_artifacts_cache/bhavanishreddy69-na_cyclone-preparedness-assistant_village-preparedness-classifier_v0"
          mkdir -p "$CACHE_DEST"
          cp -r models/render_artifact/. "$CACHE_DEST"/
          python3 -c "
          import hashlib
          from pathlib import Path
          src_dir = Path('models/render_artifact')
          dst_dir = Path('$CACHE_DEST')
          for src in src_dir.iterdir():
              if src.is_file():
                  dst = dst_dir / src.name
                  assert dst.exists(), f'Missing cached file: {src.name}'
                  assert hashlib.sha256(src.read_bytes()).digest() == hashlib.sha256(dst.read_bytes()).digest(), f'Checksum mismatch: {src.name}'
          print('W&B offline artifact cache seeded and verified successfully.')
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry (GHCR)
        # Never authenticate or push on untrusted pull requests
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Deployment Readiness Verification
  # ============================================================================
  deployment-readiness:
    name: Deployment Readiness Verification
    needs: [test, build-and-publish]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Report deployment readiness and artifact identifiers
        run: |
          echo "=========================================================="
          echo "CI/CD Pipeline Validation Complete"
          echo "Published images to GitHub Container Registry (GHCR):"
          echo "  - ghcr.io/${{ github.repository_owner }}/cyclone-assistant-api:sha-${{ github.sha }}"
          echo "  - ghcr.io/${{ github.repository_owner }}/cyclone-assistant-dashboard:sha-${{ github.sha }}"
          echo ""
          echo "Remaining CD Requirement: Deployment target infrastructure"
          echo "(e.g., Kubernetes, Cloud Run, AWS ECS, or Production VM)"
          echo "and environment secrets must be configured before enabling"
          echo "automated continuous deployment."
          echo "=========================================================="

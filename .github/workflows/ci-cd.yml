name: CI Multi-Stage Pipeline - Cyclone Intel

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # JOB 1: Linting, Formatting Checks & Python Compilation
  # ============================================================================
  job-1-lint-and-compile:
    name: "1 · Linting, Formatting & Compilation"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install linting and compilation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate YAML configuration syntax
        run: |
          python -c "
          import yaml, glob, sys
          for pattern in ['.github/workflows/*.yml', 'docker-compose*.yml']:
              for f in glob.glob(pattern):
                  with open(f) as fp:
                      yaml.safe_load(fp)
                  print(f'Valid YAML: {f}')
          "

      - name: Validate Python syntax and byte-compilation
        run: |
          python -m compileall src/ api/ scripts/ tests/

      - name: Execute Flake8 static analysis
        run: |
          flake8 src api tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src api tests scripts --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  # ============================================================================
  # JOB 2: Unit Tests & Comprehensive Model Input/Output Tests
  # ============================================================================
  job-2-unit-and-model-tests:
    name: "2 · Unit Tests & Comprehensive Model I/O"
    needs: job-1-lint-and-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed offline W&B artifact cache
        run: |
          CACHE_DEST=".wandb_artifacts_cache/bhavanishreddy69-na_cyclone-preparedness-assistant_village-preparedness-classifier_v0"
          mkdir -p "$CACHE_DEST"
          cp -r models/render_artifact/. "$CACHE_DEST"/

      - name: Execute Comprehensive Model Input/Output Test Suite
        run: |
          pytest tests/test_model_quality.py tests/test_clustering.py tests/test_wandb_tracking.py tests/test_wandb_model_registry.py -v

      - name: Execute Core Business Logic & Orchestrator Unit Tests
        run: |
          pytest tests/test_decision_engine.py tests/test_assistant_tools.py tests/test_qwen_orchestration.py -v

  # ============================================================================
  # JOB 3: Model Loading & Inference Smoke Tests
  # ============================================================================
  job-3-model-smoke-tests:
    name: "3 · Model Loading & Inference Smoke Tests"
    needs: job-2-unit-and-model-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Artifact Operational Smoke Tests
        run: |
          python scripts/model_smoke_test.py

      - name: Verify Logistic Regression Model Reproduction
        run: |
          pytest tests/test_model_reproduction.py -v

  # ============================================================================
  # JOB 4: Model Risk & Quality Gates (Promotion Eligibility)
  # ============================================================================
  job-4-model-quality-gates:
    name: "4 · Model Risk & Quality Gates"
    needs: job-3-model-smoke-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed offline W&B artifact cache
        run: |
          CACHE_DEST=".wandb_artifacts_cache/bhavanishreddy69-na_cyclone-preparedness-assistant_village-preparedness-classifier_v0"
          mkdir -p "$CACHE_DEST"
          cp -r models/render_artifact/. "$CACHE_DEST"/

      - name: Run Central Model Risk & Quality Gates Verification
        run: |
          python src/models/quality_checks.py \
            --config configs/model_quality_gates.json \
            --output-json reports/model_quality_gate_report.json \
            --output-summary reports/model_quality_gate_summary.md

      - name: Run Automated Quality Gates Regression Suite
        run: |
          pytest tests/test_model_quality_gates.py -v

      - name: Upload Quality Gate Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-gate-reports
          path: |
            reports/model_quality_gate_report.json
            reports/model_quality_gate_summary.md
            reports/model_quality_report.json
          retention-days: 30

  # ============================================================================
  # JOB 5: API Integration Tests, OpenAPI/Swagger Valid & Invalid Requests
  # ============================================================================
  job-5-api-swagger-integration:
    name: "5 · API Integration & Swagger Validation"
    needs: job-4-model-quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed offline W&B artifact cache
        run: |
          CACHE_DEST=".wandb_artifacts_cache/bhavanishreddy69-na_cyclone-preparedness-assistant_village-preparedness-classifier_v0"
          mkdir -p "$CACHE_DEST"
          cp -r models/render_artifact/. "$CACHE_DEST"/

      - name: Execute Swagger Specification & API Integration Tests
        run: |
          pytest tests/test_swagger_api.py tests/test_new_api.py tests/test_api_model_inference.py tests/test_route_inventory.py -v

  # ============================================================================
  # JOB 6: Docker Build & Compose Validation, CI Integration Checks
  # ============================================================================
  job-6-docker-validation:
    name: "6 · Docker Build & Compose Validation"
    needs: job-5-api-swagger-integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet

      - name: Build and Validate Docker Container Images
        run: |
          docker build -f Dockerfile.api -t cyclone-api:ci-test .
          docker build -f Dockerfile.dashboard -t cyclone-dashboard:ci-test .
          docker build -f Dockerfile.frontend -t cyclone-frontend:ci-test .

      - name: Log in to GitHub Container Registry (Master Push Only)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Publish Immutable Artifacts to GHCR (Master Push Only)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.repository }}"

          for SVC in api dashboard frontend; do
            IMAGE_ID="ghcr.io/$REPO/$SVC"
            echo "Publishing: $IMAGE_ID:sha-$SHORT_SHA"
            docker tag "cyclone-$SVC:ci-test" "$IMAGE_ID:sha-$SHORT_SHA"
            docker push "$IMAGE_ID:sha-$SHORT_SHA"
          done

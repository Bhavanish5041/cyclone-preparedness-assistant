name: CD Pipeline - Controlled Production Deployment (Self-Hosted Runner)

# Strict manual trigger only — NEVER runs automatically on push or pull request.
# Security Policy: Untrusted PR code is NEVER permitted to execute on the self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - simulation
      image_tag:
        description: "Exact immutable Docker image tag to deploy (e.g., sha-1221e7c). Mutable 'latest' is strictly forbidden."
        required: true
        default: "sha-1221e7c"
        type: string
      git_commit_sha:
        description: "Git Commit SHA to deploy (optional; defaults to triggering workflow commit SHA)"
        required: false
        default: ""
        type: string
      services:
        description: "Services to deploy ('auto' detects changed services only)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - api
          - frontend
          - dashboard
      confirm_deployment:
        description: "Explicit safety confirmation phrase (must type 'CONFIRM-DEPLOY')"
        required: true
        default: ""
        type: string
      public_tunnel_url:
        description: "Optional public Cloudflare Tunnel URL (e.g. https://...trycloudflare.com) for pre/post smoke tests"
        required: false
        default: ""
        type: string
      enable_smoke_tests:
        description: "Execute automated post-deployment smoke tests if tunnel URL provided"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: cyclone-deployment-lock
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Pre-Deployment Verification & Safety Gates (GitHub-Hosted Runner)
  # ============================================================================
  pre-deployment-verification:
    name: "Pre-Deployment Verification & Safety Gate"
    runs-on: ubuntu-latest
    outputs:
      target_commit: ${{ steps.resolve_target.outputs.target_commit || github.sha }}
    steps:
      - name: Validate inputs, safety gates, and resolve target commit SHA
        id: resolve_target
        run: |
          if [ "${{ github.event.inputs.confirm_deployment }}" != "CONFIRM-DEPLOY" ]; then
            echo "CRITICAL: Deployment aborted. You must enter 'CONFIRM-DEPLOY' to trigger deployment."
            exit 1
          fi
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          TARGET_ENV="${{ github.event.inputs.target_environment }}"
          if [ "$TARGET_ENV" = "production" ]; then
            if [ "$IMAGE_TAG" = "latest" ] || [ "$IMAGE_TAG" = "master" ] || [ "$IMAGE_TAG" = "main" ]; then
              echo "CRITICAL POLICY VIOLATION: Deploying mutable tag '$IMAGE_TAG' to production is strictly forbidden."
              echo "Production deployments must specify an exact immutable tag produced by CI (e.g., sha-<commit_sha> or vX.Y.Z)."
              exit 1
            fi
            if ! echo "$IMAGE_TAG" | grep -E -q '^(sha-[0-9a-zA-Z._-]+|v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.]+)?)$'; then
              echo "CRITICAL: Image tag '$IMAGE_TAG' does not conform to required immutable tag format (sha-<short_sha> or vX.Y.Z)."
              exit 1
            fi
          fi

          RAW_COMMIT="${{ github.event.inputs.git_commit_sha }}"
          RAW_COMMIT="$(echo "$RAW_COMMIT" | xargs)"
          if [ -z "$RAW_COMMIT" ] || [ "$RAW_COMMIT" = "HEAD" ] || [ "$RAW_COMMIT" = "head" ]; then
            RESOLVED_SHA="${{ github.sha }}"
            echo "Notice: git_commit_sha is unset or 'HEAD'. Using triggering workflow commit SHA: $RESOLVED_SHA"
          elif echo "$RAW_COMMIT" | grep -E -q '^[0-9a-fA-F]{40}$'; then
            RESOLVED_SHA="$RAW_COMMIT"
            echo "Using validated full commit SHA: $RESOLVED_SHA"
          elif echo "$RAW_COMMIT" | grep -E -q '^[0-9a-fA-F]{7,39}$'; then
            API_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$RAW_COMMIT" | \
              python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('sha', ''))" 2>/dev/null || true)
            if [ -n "$API_SHA" ] && echo "$API_SHA" | grep -E -q '^[0-9a-fA-F]{40}$'; then
              RESOLVED_SHA="$API_SHA"
              echo "Resolved short SHA $RAW_COMMIT to full commit SHA: $RESOLVED_SHA"
            else
              echo "CRITICAL: Could not resolve commit SHA '$RAW_COMMIT' to a valid full Git commit."
              exit 1
            fi
          else
            echo "CRITICAL: Invalid git_commit_sha '$RAW_COMMIT'. Must be empty, 'HEAD', or a hexadecimal commit SHA."
            exit 1
          fi

          echo "target_commit=$RESOLVED_SHA" >> $GITHUB_OUTPUT
          echo "Explicit confirmation received. Target: $TARGET_ENV"
          echo "Verified Immutable Image Tag: $IMAGE_TAG"
          echo "Target Commit SHA: $RESOLVED_SHA"
          echo "Target Services: ${{ github.event.inputs.services }}"

      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_target.outputs.target_commit || github.sha }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Registry and Artifact Integrity
        run: |
          python scripts/model_registry_cli.py validate

      - name: Run Model Quality Gates Regression
        run: |
          pytest tests/test_model_quality_gates.py -v

      - name: Optional Pre-Deployment Target Health Check
        if: ${{ github.event.inputs.public_tunnel_url != '' }}
        run: |
          TARGET="${{ github.event.inputs.public_tunnel_url }}"
          echo "Probing active target: $TARGET/health"
          curl -f -s --max-time 15 "$TARGET/health" || echo "Notice: Target currently unreachable or tunnel renewing."

  # ============================================================================
  # 2. Production Release Approval Gate (GitHub Environment Protection Rule)
  # ============================================================================
  production-release-gate:
    name: "Production Release Gate (Manual Approval)"
    needs: pre-deployment-verification
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_environment }}
    outputs:
      target_commit: ${{ needs.pre-deployment-verification.outputs.target_commit || github.sha }}
    steps:
      - name: Log Deployment Authorization
        run: |
          echo "=========================================================="
          echo "DEPLOYMENT AUTHORIZED & APPROVED"
          echo "Environment: ${{ github.event.inputs.target_environment }}"
          echo "Approved by: ${{ github.actor }}"
          echo "Target Commit: ${{ needs.pre-deployment-verification.outputs.target_commit || github.sha }}"
          echo "Target Image Tag: ${{ github.event.inputs.image_tag }}"
          echo "Services Selection: ${{ github.event.inputs.services }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "=========================================================="

  # ============================================================================
  # 3. Direct Laptop Deployment via Self-Hosted Runner
  # ============================================================================
  deploy-to-laptop:
    name: "Deploy Services to Ubuntu Laptop (Self-Hosted Runner)"
    needs: [pre-deployment-verification, production-release-gate]
    environment:
      name: ${{ github.event.inputs.target_environment }}
    runs-on: [self-hosted, linux, cyclone-runner]
    # Security Boundary: Restrict execution strictly to dispatch on authorized repository
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Bhavanish5041/cyclone-preparedness-assistant' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-deployment-verification.outputs.target_commit || github.sha }}
          lfs: false

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Execute Automated Zero-Downtime Deployment with Rollback Guard
        run: |
          SIM_FLAG=""
          if [ "${{ github.event.inputs.target_environment }}" = "simulation" ]; then
            SIM_FLAG="--simulate"
          fi

          python3 scripts/deploy_production.py \
            --image-tag "${{ github.event.inputs.image_tag }}" \
            --commit-sha "${{ needs.pre-deployment-verification.outputs.target_commit || github.sha }}" \
            --repo-owner "${{ github.repository_owner }}" \
            --services "${{ github.event.inputs.services }}" \
            --health-timeout 60 \
            $SIM_FLAG

      - name: Execute Local Post-Deployment Validation Suite
        if: ${{ github.event.inputs.target_environment != 'simulation' }}
        run: |
          python3 scripts/validate_deployment.py --proxy-url http://127.0.0.1 --api-url http://127.0.0.1:8000

      - name: Upload Deployment Audit Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-audit-log-${{ github.run_id }}
          path: logs/deployment.log
          retention-days: 30

  # ============================================================================
  # 4. Post-Deployment Smoke Tests via Public Cloudflare Tunnel (GitHub-Hosted)
  # ============================================================================
  post-deployment-smoke-tests:
    name: "Post-Deployment Remote Smoke Tests"
    needs: deploy-to-laptop
    if: ${{ github.event.inputs.public_tunnel_url != '' && github.event.inputs.enable_smoke_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Remote Smoke Tests Against Cloudflare Tunnel
        run: |
          TARGET="${{ github.event.inputs.public_tunnel_url }}"
          echo "Executing remote smoke tests against $TARGET..."
          python3 -c "
          import urllib.request, json, sys
          endpoints = [
              '$TARGET/health',
              '$TARGET/ready',
              '$TARGET/api/health',
              '$TARGET/api/dashboard/overview',
              '$TARGET/api/communities?search=Tallur',
              '$TARGET/api/districts',
          ]
          for ep in endpoints:
              try:
                  req = urllib.request.Request(ep, headers={'User-Agent': 'DeploymentSmokeTest/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      assert resp.status == 200, f'Endpoint {ep} returned {resp.status}'
                      print(f'PASS: [200] {ep}')
              except Exception as e:
                  print(f'FAIL: {ep} -> {e}')
                  sys.exit(1)
          print('All post-deployment smoke tests passed successfully.')
          "

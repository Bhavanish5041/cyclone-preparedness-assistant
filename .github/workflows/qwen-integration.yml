name: Qwen & Ollama Live Integration Testing (Manual)

# Manual trigger only — strictly isolated from normal CI to avoid heavy weight downloads
on:
  workflow_dispatch:
    inputs:
      qwen_model_tag:
        description: "Ollama model tag to pull and benchmark"
        required: true
        default: "qwen2.5:0.5b-instruct"
        type: string
      run_full_benchmark:
        description: "Run comprehensive latency and memory benchmark"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: qwen-ollama-integration-test
  cancel-in-progress: false

jobs:
  qwen-live-integration:
    name: "Live Qwen & Ollama Integration Gate"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed and verify offline W&B artifact cache
        run: |
          CACHE_DEST=".wandb_artifacts_cache/bhavanishreddy69-na_cyclone-preparedness-assistant_village-preparedness-classifier_v0"
          mkdir -p "$CACHE_DEST"
          cp -r models/render_artifact/. "$CACHE_DEST"/

      - name: Install and launch Ollama daemon
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama daemon to initialize on localhost:11434..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama daemon active."
              break
            fi
            sleep 1
          done

      - name: Pull target Qwen model weights
        run: |
          ollama pull ${{ github.event.inputs.qwen_model_tag }}

      - name: Run Live Qwen Intent Resolution & Tool Calling Tests
        run: |
          pytest tests/test_qwen_orchestration.py tests/test_ollama_integration.py -v

      - name: Run Quality Pipeline with Live Ollama Engine
        run: |
          python scripts/run_model_evaluation.py

      - name: Upload Live Model Quality Benchmark
        uses: actions/upload-artifact@v4
        with:
          name: live-qwen-model-quality-report
          path: |
            reports/model_quality_report.json
            reports/model_quality_summary.md
          retention-days: 30

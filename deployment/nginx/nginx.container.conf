# CYCLONE INTEL - Container Network Production Nginx Configuration
# Reverse proxy routing for containerized React frontend and FastAPI backend

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Embedded Docker DNS resolver for dynamic service discovery
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream "http://api:8000";

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body restrictions
        client_max_body_size 10M;
        client_body_timeout 15s;
        client_header_timeout 15s;

        # Static Frontend Assets
        root /usr/share/nginx/html;
        index index.html;

        # Static assets with caching
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # React SPA Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Strict Prevention: Block any attempt to access Ollama or internal admin ports
        location ~* ^/(ollama|api/generate|api/tags|api/pull) {
            deny all;
            return 404;
        }

        # Conversational Assistant Endpoint (Rate limited to 5 req/s with burst=10)
        location /api/assistant/chat {
            limit_req zone=chat_limit burst=10 nodelay;

            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        # General Backend API Reverse Proxy
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # OpenAPI Docs
        location /docs {
            proxy_pass $api_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass $api_upstream/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass $api_upstream/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health and readiness endpoints
        location /health {
            proxy_pass $api_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ready {
            proxy_pass $api_upstream/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

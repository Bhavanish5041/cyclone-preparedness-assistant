name: cyclone-prod

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${FRONTEND_IMAGE:-cyclone-assistant-frontend:latest}
    container_name: cyclone-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - cyclone-net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-cyclone-assistant-api:latest}
    container_name: cyclone-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - WANDB_MODEL_ARTIFACT=${WANDB_MODEL_ARTIFACT:-village-preparedness-classifier:v0}
      - WANDB_ENTITY=${WANDB_ENTITY:-bhavanishreddy69-na}
      - WANDB_PROJECT=${WANDB_PROJECT:-cyclone-preparedness-assistant}
      - WANDB_CACHE_DIR=/app/.wandb_artifacts_cache
      - OLLAMA_BASE_URL=${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MONITORING_REPORTS_DIR=/app/reports/model_monitoring
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    volumes:
      - wandb_cache:/app/.wandb_artifacts_cache
      - monitoring_reports:/app/reports/model_monitoring
    networks:
      - cyclone-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: ${DASHBOARD_IMAGE:-cyclone-assistant-dashboard:latest}
    container_name: cyclone-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - CYCLONE_ADAPTER_MODE=rest
      - CYCLONE_API_BASE_URL=http://api:8000
      - API_BASE_URL=http://api:8000
      - CYCLONE_API_TIMEOUT=15.0
      - PYTHONUNBUFFERED=1
    networks:
      - cyclone-net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: cyclone-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - cyclone-net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wandb_cache:
    name: cyclone_wandb_cache
  monitoring_reports:
    name: cyclone_monitoring_reports
  prometheus_data:
    name: cyclone_prometheus_data

networks:
  cyclone-net:
    name: cyclone_internal_net
    driver: bridge

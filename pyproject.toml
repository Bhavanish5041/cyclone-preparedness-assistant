[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclone-preparedness-assistant"
version = "0.1.0"
description = "Defensible, evidence-based cyclone preparedness assessment and decision support assistant"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "src"]
